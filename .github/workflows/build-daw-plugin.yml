name: Build AWclean
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build_plugin:
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            cmake_args: -G"Visual Studio 17 2022" -A x64

          - os: macos-latest
            name: macos
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

          - os: ubuntu-latest
            name: linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare for JUCE
        if: runner.os != 'Linux'
        uses: surge-synthesizer/sst-githubactions/prepare-for-juce@main
        with:
          os: ${{ runner.os }}

      # The shared action above pins gcc-12, which current Ubuntu runners no longer ship
      - name: Prepare for JUCE (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev \
            libfreetype-dev libfontconfig1-dev libgl-dev libcurl4-openssl-dev

      - name: Work out version
        id: ver
        run: |
          # Tags look like v1.2.3; the plugin reports that version so the update button can compare
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "args=-DAWCLEAN_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check overlay header is up to date and formulas work
        if: runner.os == 'Linux'
        run: |
          python3 awclean/gen_overlay.py
          git diff --exit-code src/AWCleanOverlay.h
          c++ -std=c++17 -I src awclean/test/overlay_test.cpp -o overlay_test
          ./overlay_test

      - name: Build
        run: |
          # No Apple Developer ID here, so the mac installer is unsigned and the plugins are ad-hoc signed
          cmake -S . -B ./build ${{ matrix.cmake_args }} ${{ steps.ver.outputs.args }} -DCMAKE_BUILD_TYPE=Release -DBUILD_JUCE_PLUGIN=TRUE
          cmake --build ./build --config Release --target awcons-installer --parallel 3

      - name: Check auto gain lands on the input's loudness
        if: runner.os == 'Linux'
        run: |
          c++ -std=c++17 -O2 -I src -I src-juce awclean/test/autogain_test.cpp \
            build/libairwin-registry.a build/libawdoc_resources.a -o autogain_test
          ./autogain_test

      - name: Show Installer Directory
        run: |
          ls -l ./build/installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: build/installer
          name: awclean-${{ matrix.name }}

  publish_release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build_plugin]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
